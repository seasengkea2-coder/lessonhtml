<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container{
            border: 1px solid green;
            width: 700px;
        }
        .container-box{
            display: flex;
        }
        .container .logo{
            background-color: black;
            height: 80px;
            width: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container .heading{
            background-color: pink;
            height: 80%;
        }
        .container-box .Menu{
            width: 80px;
            background-color: blue;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        .container-box .sections{
            display: flex;
        }
        .container-box .section1{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container-box .section2{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container-box .section3{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container-box .page{
            display: flex;
        }
        .page .pagecontent{
            background-color: red;
            height: 20px;
            width: 80%;
        }
        .page .sidebar{
            width: 20px;
            display: flex;
        }
        .fooder{
            background-color: red;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <div class="container-box">
    <div class="container">
        <div class="logo">Logo</div>
        <div class="heading">Heading</div>
    </div>
    <div class="Menu">Menu</div>

    <div class="sections">
        <div class="section1">section1</div>
        <div class="section2">section2</div>
        <div class="section3">section3</div>
    </div>
    
    <div class="page">
        <div class="pagecontent">Page xcontent</div>
        <div class="sidebar">Sidebar</div>
    </div>

    <div class="fooder">Fooder</div>
    
    </div>
</body>
</html>
