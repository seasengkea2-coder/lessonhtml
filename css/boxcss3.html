<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0%;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container-box{
            border: 1px solid red;
            width: 700px;
        }
        .container-box .container{
            display: flex;
        }
        .container .logo{
            background-color: red;
            height: 80px;
            width: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container .heading{
            background-color: gold;
            width: 80%;
        }
        .container-box menu{
            background-color: blue;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container-box .sections{
            display: flex;
        }
        .sections .sec1{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
            width: 33.33%;
            background-color: red;
        }
        .sections .sec2{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
            width: 33.33%;
            background-color: pink;
        }
        .sections .sec3{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 120px;
            width: 33.33%;
            background-color: rgb(0, 0, 0);
        }
        .container-box .Page{
            display: flex;
        }
        .Page .pagecontent{
            background-color: red;
            height: 200px;
            width: 80%;
            background-color: blue;
        }
        .Page .sidebar{
            width: 20%;
            background-color: pink;
        }
        footer{
            background-color: red;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container-box">
        <div class="container">
            <div class="logo">logo</div>
            <div class="heading">heading</div>
            </div>


            <menu>menu</menu>


            <div class="sections">
                <section class="sec1">section1</section>
                <section  class="sec2">section2</section>
                 <section class="sec3">section3</section>   
            </div>
            
            <div class="Page">
                <div class="pagecontent">pagecontent</div>
                <div class="sidebar">sidebar</div>
            </div>

            <footer>footer</footer>
        

    </div>
</body>
</html>
